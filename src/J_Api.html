<script>
// ============================================================
// STARTER-KIT - J_Api.html (v2.11.0 — loader 5M + 12L + 8A + 6E + dashboard 4+4+4)
// ============================================================
// Loader data dari backend (CoreLib.dispatchAction).
// Pola: satu loader per domain; data laporan/analisa/evaluasi disimpan
// per-tab (objek keyed) agar pindah tab tak memuat ulang data lama.

// Peta tab → aksi backend (global — tidak boleh di dalam methods Vue)
window.SK_MAPS = {
  LAP_AKSI: {
    kategori: 'lap_kategori', jenis: 'lap_jenis', lokasi: 'lap_lokasi',
    periode: 'lap_periode', pegawai: 'lap_pegawai', status: 'lap_status',
    satuan: 'lap_satuan', jenis_periode: 'lap_jenis_periode',
    jenis_lokasi: 'lap_jenis_lokasi', detail: 'lap_detail_utama',
    lampiran: 'lap_lampiran', approval: 'lap_approval'
  },
  ANA_AKSI: {
    lokasi: 'analisa_distribusi_lokasi', jenis: 'analisa_distribusi_jenis',
    top_pegawai: 'analisa_top_pegawai', beban_lokasi: 'analisa_beban_lokasi',
    korelasi: 'analisa_korelasi_jenis_lokasi', tren: 'analisa_tren_periode',
    umur: 'analisa_umur_data', sla: 'analisa_sla_approval'
  },
  EVA_AKSI: {
    kelengkapan: 'evaluasi_kelengkapan', sla: 'evaluasi_sla_verifikasi',
    periode: 'evaluasi_kepatuhan_periode', kualitas: 'evaluasi_kualitas_data',
    lampiran: 'evaluasi_lampiran', rtl: 'evaluasi_rtl_terbuka'
  },
  MASTER_AKSI: {
    kategori: { save: 'save_kategori', del: 'delete_kategori' },
    jenis:    { save: 'save_jenis',    del: 'delete_jenis' },
    periode:  { save: 'save_periode',  del: 'delete_periode' },
    satuan:   { save: 'save_satuan',   del: 'delete_satuan' },
    lokasi:   { save: 'save_lokasi',   del: 'delete_lokasi' }
  }
};

window.StarterKitApi = {
  methods: {

    // Loader gabungan — DRY untuk initApp + Refresh dashboard
    async loadAll(silent) {
      var s = silent === true;
      await Promise.all([
        this.loadDashboard(s),
        this.loadMasterSatelit(s),
        this.loadUtama(1, s),
        this.loadRtl(1, s)
      ]);
    },

    // Dashboard (4 kartu + 4 chart + 4 panel — server-side)
    async loadDashboard(silent) {
      var isSilent = silent === true;
      try {
        var res = await this.callServer('get_dashboard');
        if (res && res.success && res.data) {
          var d = res.data;
          this.dashboardData = {
            summary: d.summary || { totalUtama: 0, totalSelesai: 0, approvalMenunggu: 0, rtlTerbuka: 0 },
            chartTren: d.chartTren || { labels: [], counts: [] },
            chartJenis: d.chartJenis || { labels: [], counts: [] },
            chartKategori: d.chartKategori || { labels: [], counts: [] },
            chartLokasi: d.chartLokasi || { labels: [], counts: [] },
            panelTerbaru: d.panelTerbaru || [],
            panelApproval: d.panelApproval || [],
            panelRtl: d.panelRtl || [],
            panelTidakLengkap: d.panelTidakLengkap || [],
            role: d.role || 'viewer',
            nama: d.nama || ''
          };
        } else if (!isSilent) this.showToast('Gagal memuat dashboard.', 'error');
      } catch (e) {
        console.error('loadDashboard', e);
        if (!isSilent) this.showToast('Error koneksi dashboard.', 'error');
      }
    },

    // Master satelit (5 master + pegawai)
    async loadMasterSatelit(silent) {
      var isSilent = silent === true;
      this.masterLoading = true;
      try {
        var res = await this.callServer('get_master_satelit');
        if (res && res.success && res.data) {
          this.kategoriList = res.data.kategori || [];
          this.jenisList = res.data.jenis || [];
          this.periodeList = res.data.periode || [];
          this.satuanList = res.data.satuan || [];
          this.lokasiList = res.data.lokasi || [];
          this.pegawaiList = res.data.pegawai || [];
        } else if (!isSilent) this.showToast('Gagal memuat master.', 'error');
      } catch (e) {
        if (!isSilent) this.showToast('Error koneksi master.', 'error');
      } finally { this.masterLoading = false; }
    },

    // T_UTAMA (paginasi server-side) — + scope Saya/Semua (v2.12.0)
    async loadUtama(page, silent) {
      var isSilent = silent === true;
      this.utamaLoading = true;
      try {
        var p = page || this.utamaPagination.page || 1;
        var scopeVal = 'all';
        try { scopeVal = (window.AppCore && AppCore.getMyScope) ? AppCore.getMyScope() : (this.filterScope || 'all'); } catch(e){ scopeVal = this.filterScope || 'all'; }
        var res = await this.callServer('get_utama_list', {
          page: p,
          per_page: this.utamaPagination.per_page,
          search: this.utamaFilters.search,
          status: this.utamaFilters.status,
          jenis_id: this.utamaFilters.jenis_id,
          lokasi_id: this.utamaFilters.lokasi_id,
          tahun: this.utamaFilters.tahun,
          filterScope: scopeVal
        });
        if (res && res.success) {
          this.utamaList = res.data || [];
          this.utamaTotal = res.total || 0;
          this.utamaTotalPages = res.total_pages || 1;
          this.utamaPagination.page = res.page || p;
        } else if (!isSilent) this.showToast((res && res.error) || 'Gagal memuat T_UTAMA', 'error');
      } catch (e) {
        if (!isSilent) this.showToast('Error koneksi T_UTAMA', 'error');
      } finally { this.utamaLoading = false; }
    },

    // Laporan (12 tab) — single
    async loadLaporan(tab) {
      var t = tab || this.laporanTab;
      this.lapLoading = true;
      try {
        var aksi = window.SK_MAPS.LAP_AKSI[t];
        if (!aksi) { this.lapLoading = false; return; }
        var res = await this.callServer(aksi, { tahun: this.lapTahun });
        if (res && res.success) this.lapData[t] = res.data;
        else this.showToast((res && res.error) || 'Gagal memuat laporan.', 'error');
      } catch (e) { this.showToast('Error koneksi laporan.', 'error'); }
      finally { this.lapLoading = false; }
    },
    // Laporan — 2 tab grid (dimensi 7 + matriks 5)
    async loadLaporanGrup(grup) {
      var g = grup || this.laporanGrupTab || 'dimensi';
      var tabs = g==='dimensi' ? ['kategori','jenis','lokasi','periode','pegawai','status','satuan'] : ['jenis_periode','jenis_lokasi','detail','lampiran','approval'];
      this.lapLoading = true;
      try {
        var promises = tabs.map(async (t) => {
          var aksi = window.SK_MAPS.LAP_AKSI[t];
          if (!aksi) return;
          try {
            var res = await this.callServer(aksi, { tahun: this.lapTahun });
            if (res && res.success) {
              if (t==='detail') {
                // getUtamaList returns {data:[], total, total_pages, page} — wrap to {data, total}
                if (Array.isArray(res.data)) this.lapData[t] = { data: res.data, total: res.total || res.data.length, tahun: this.lapTahun };
                else this.lapData[t] = res.data;
              } else {
                this.lapData[t] = res.data;
              }
            }
          } catch(e) {}
        });
        await Promise.all(promises);
      } finally { this.lapLoading = false; }
    },

    // Analisa (8 tab) — single
    async loadAnalisa(tab) {
      var t = tab || this.analisaTab;
      this.anaLoading = true;
      try {
        var aksi = window.SK_MAPS.ANA_AKSI[t];
        if (!aksi) { this.anaLoading = false; return; }
        var res = await this.callServer(aksi, { tahun: this.anaTahun });
        if (res && res.success) this.anaData[t] = res.data;
        else this.showToast((res && res.error) || 'Gagal memuat analisa.', 'error');
      } catch (e) { this.showToast('Error koneksi analisa.', 'error'); }
      finally { this.anaLoading = false; }
    },
    // Analisa — grid 1 halaman (8 sekaligus)
    async loadAnalisaGrid() {
      var tabs = Object.keys(window.SK_MAPS.ANA_AKSI);
      this.anaLoading = true;
      try {
        var promises = tabs.map(async (t) => {
          var aksi = window.SK_MAPS.ANA_AKSI[t];
          try { var res = await this.callServer(aksi, { tahun: this.anaTahun }); if (res && res.success) this.anaData[t] = res.data; } catch(e) {}
        });
        await Promise.all(promises);
        this.anaGridLoaded = true;
      } finally { this.anaLoading = false; }
    },

    // Evaluasi (6 tab) — single
    async loadEvaluasi(tab) {
      var t = tab || this.evaluasiTab;
      this.evaLoading = true;
      try {
        var aksi = window.SK_MAPS.EVA_AKSI[t];
        if (!aksi) { this.evaLoading = false; return; }
        var res = await this.callServer(aksi, { tahun: this.evaTahun });
        if (res && res.success) this.evaData[t] = res.data;
        else this.showToast((res && res.error) || 'Gagal memuat evaluasi.', 'error');
      } catch (e) { this.showToast('Error koneksi evaluasi.', 'error'); }
      finally { this.evaLoading = false; }
    },
    // Evaluasi — grid 1 halaman (6 sekaligus)
    async loadEvaluasiGrid() {
      var tabs = Object.keys(window.SK_MAPS.EVA_AKSI);
      this.evaLoading = true;
      try {
        var promises = tabs.map(async (t) => {
          var aksi = window.SK_MAPS.EVA_AKSI[t];
          try { var res = await this.callServer(aksi, { tahun: this.evaTahun }); if (res && res.success) this.evaData[t] = res.data; } catch(e) {}
        });
        await Promise.all(promises);
        this.evaGridLoaded = true;
      } finally { this.evaLoading = false; }
    },

    // RTL
    async loadRtl(page, silent) {
      var isSilent = silent === true;
      this.rtlLoading = true;
      try {
        var p = page || this.rtlPage || 1;
        var res = await this.callServer('get_tindak_lanjut_list', {
          page: p,
          search: this.rtlSearch,
          status_rtl: this.rtlFilters.status_rtl,
          sumber_evaluasi: this.rtlFilters.sumber_evaluasi,
          tahun: this.rtlFilters.tahun,
          per_page: 10
        });
        if (res && res.success) {
          this.rtlList = res.data || [];
          this.rtlTotalData = res.total || this.rtlList.length;
          this.rtlTotalPages = res.total_pages || 1;
          this.rtlPage = res.page || p;
        } else if (!isSilent) this.showToast((res && res.error) || 'Gagal memuat RTL', 'error');
      } catch (e) {
        if (!isSilent) this.showToast('Error koneksi RTL', 'error');
      } finally { this.rtlLoading = false; }
    },

    async generateRtl() {
      this.rtlGenerating = true;
      try {
        var res = await this.callServer('generate_tindak_lanjut', { sumber_evaluasi: this.rtlGenerateSumber, tahun: this.rtlGenerateTahun });
        if (res && res.success) {
          this.showToast('Generate RTL: ' + (res.data.generated || 0) + ' baru', 'success');
          this.loadRtl(1);
        } else this.showToast(res.error || 'Gagal generate RTL', 'error');
      } catch (e) { this.showToast('Error generate RTL', 'error'); }
      finally { this.rtlGenerating = false; }
    }
  }
};
</script>
