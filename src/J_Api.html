<script>
// ============================================================
// STARTER-KIT - J_Api.html (v2.10.0 — 11 sheet + 72 handler + RTL + UIUX v1.10)
// ============================================================
// Loader data dari backend (CoreLib.dispatchAction) — pola si-arsip v1.10
// - min-w + table-scroll di view, badge valid, app-stat-card, btn-icon, filter label, modal v-if

window.StarterKitApi = {
  methods: {

    // Loader gabungan — DRY untuk initApp + Refresh dashboard
    async loadAll(silent) {
      var s = silent === true;
      await Promise.all([
        this.loadDashboard(s),
        this.loadMasterSatelit(s),
        this.loadUtama(1),
        this.loadReferensi(),
        this.loadRtl(1)
      ]);
    },

    // Dashboard
    async loadDashboard(silent) {
      var isSilent = silent === true;
      try {
        var res = await this.callServer('get_dashboard');
        if (res && res.success && res.data) {
          this.dashboardData = Object.assign({
            totalUtama: 0, totalBaru: 0, totalSelesai: 0, totalRekap: 0, totalRtl: 0, rtlBaru: 0, rtlSelesai: 0, role: 'viewer', nama: ''
          }, res.data);
        } else if (!isSilent) this.showToast('Gagal memuat dashboard.', 'error');
      } catch (e) {
        console.error('loadDashboard', e);
        if (!isSilent) this.showToast('Error koneksi dashboard.', 'error');
      }
    },

    // Master satelit
    async loadMasterSatelit(silent) {
      var isSilent = silent === true;
      try {
        var res = await this.callServer('get_master_satelit');
        if (res && res.success && res.data) {
          this.referensiList = res.data.referensi || [];
          this.kategoriList = res.data.kategori || [];
          this.satuanList = res.data.satuan || [];
        }
      } catch (e) {
        if (!isSilent) console.error('loadMasterSatelit', e);
      }
    },

    // T_UTAMA
    async loadUtama(page) {
      this.utamaLoading = true;
      try {
        var res = await this.callServer('get_utama_list', { page: page || 1, search: this.utamaFilters.search, status: this.utamaFilters.status });
        if (res && res.success) this.utamaList = res.data || [];
        else this.showToast(res.error || 'Gagal memuat T_UTAMA', 'error');
      } catch (e) { this.showToast('Error koneksi T_UTAMA', 'error'); }
      finally { this.utamaLoading = false; }
    },

    // Generic master list (M_*)
    async loadReferensi() {
      this.referensiLoading = true;
      try {
        var res = await this.callServer('get_referensi_list', {});
        if (res && res.success) this.referensiList = res.data || [];
      } catch (e) {} finally { this.referensiLoading = false; }
    },

    // Laporan contoh L4/L5
    async loadLapKlasifikasi() {
      this.lapKlasLoading = true;
      try {
        var res = await this.callServer('lap_rekap_klasifikasi', { tahun: this.lapKlasTahun });
        if (res && res.success) this.lapKlasData = res.data;
        else this.showToast(res.error || 'Gagal rekap klasifikasi', 'error');
      } catch (e) { this.showToast('Error koneksi rekap', 'error'); }
      finally { this.lapKlasLoading = false; }
    },

    // Analisa contoh A3
    async loadAnalisaUnit() {
      this.analisaLoading = true;
      try {
        var res = await this.callServer('analisa_distribusi_unit', { tahun: this.analisaTahun });
        if (res && res.success) this.analisaUnitData = res.data;
        else this.showToast(res.error || 'Gagal analisa unit', 'error');
      } catch (e) { this.showToast('Error koneksi analisa', 'error'); }
      finally { this.analisaLoading = false; }
    },

    // RTL — v2.10.0 (contoh si-arsip R1-R5)
    async loadRtl(page) {
      this.rtlLoading = true;
      try {
        var p = page || this.rtlPage || 1;
        var res = await this.callServer('get_tindak_lanjut_list', {
          page: p,
          search: this.rtlSearch,
          status_rtl: this.rtlFilters.status_rtl,
          sumber_evaluasi: this.rtlFilters.sumber_evaluasi,
          tahun: this.rtlFilters.tahun,
          per_page: 10
        });
        if (res && res.success) {
          this.rtlList = res.data || [];
          this.rtlTotalData = res.total || this.rtlList.length;
          this.rtlTotalPages = res.total_pages || 1;
          this.rtlPage = res.page || p;
        } else {
          this.showToast(res.error || 'Gagal memuat RTL', 'error');
        }
      } catch (e) {
        this.showToast('Error koneksi RTL', 'error');
      } finally { this.rtlLoading = false; }
    },

    async generateRtl() {
      this.rtlGenerating = true;
      try {
        var res = await this.callServer('generate_tindak_lanjut', { sumber_evaluasi: this.rtlGenerateSumber, tahun: this.rtlGenerateTahun });
        if (res && res.success) {
          this.showToast('Generate RTL: ' + (res.data.generated || 0) + ' baru', 'success');
          this.loadRtl(1);
        } else this.showToast(res.error || 'Gagal generate RTL', 'error');
      } catch (e) { this.showToast('Error generate RTL', 'error'); }
      finally { this.rtlGenerating = false; }
    }

  }
};
</script>
