<!-- ============================================================
     STARTER-KIT - V_Dashboard.html (v2.1.0)
     ============================================================
     Dashboard contoh dengan kit CDN @v2.8.1:
       Row 1: 4 kartu KPI (<app-stat-card>)
       Row 2: 2 chart (<app-chart-bar> + <app-chart-doughnut>)
       Row 3: filter + tabel (<app-crud-table>) + aksi baris
       + blok KOMENTAR untuk naik ke "Executive" (4 chart + 4 tabel)

     Agregat chart dihitung di frontend dari `utamaList` yang sudah
     dimuat — TIDAK butuh handler backend tambahan.

     [SESUAIKAN] Ganti label, kolom, dan field dengan bisnis Anda.
     ============================================================ -->

<section v-if="currentPage === 'dashboard'" class="space-y-6 animate-fade-in">

  <!-- ==================== HEADER ==================== -->
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 border-b border-slate-200/80 dark:border-slate-800 pb-4">
    <div>
      <h2 class="text-2xl font-bold tracking-tight flex items-center gap-2 text-slate-800 dark:text-white">
        <i class="fa-solid fa-gauge-high text-emerald-600 dark:text-emerald-400"></i>
        Dashboard
      </h2>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">
        Ringkasan data &amp; daftar transaksi utama.
      </p>
    </div>
    <div class="flex flex-wrap gap-2 self-start md:self-auto">
      <button @click="loadAll()" class="btn btn-secondary text-xs">
        <i class="fa-solid fa-rotate"></i>
        <span>Refresh</span>
      </button>
      <button @click="openUtamaForm()" class="btn btn-primary text-xs">
        <i class="fa-solid fa-plus"></i>
        <span>Tambah Data</span>
      </button>
    </div>
  </div>

  <!-- ==================== ROW 1: KPI CARDS ==================== -->
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
    <app-stat-card title="Total Data"
                   :value="dashboardData.totalUtama || 0"
                   icon="fa-solid fa-list-check"
                   color="emerald"
                   subtext="semua status"></app-stat-card>

    <app-stat-card title="Sedang Proses"
                   :value="dashboardData.totalAktif || 0"
                   icon="fa-solid fa-hourglass-half"
                   color="amber"
                   subtext="draft / diajukan / proses"></app-stat-card>

    <app-stat-card title="Selesai"
                   :value="dashboardData.totalSelesai || 0"
                   icon="fa-solid fa-circle-check"
                   color="sky"
                   subtext="tuntas"></app-stat-card>

    <app-stat-card title="Pegawai"
                   :value="dashboardData.totalPegawai || 0"
                   icon="fa-solid fa-users"
                   color="purple"
                   subtext="SIMPEG"></app-stat-card>
  </div>

  <!-- ==================== ROW 2: CHART ==================== -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <!-- Tren 12 bulan — col-span-2 -->
    <div class="lg:col-span-2">
      <app-chart-bar :labels="chartTrenLabels"
                     :datasets="chartTrenDatasets"
                     :colors="chartTrenColors"
                     title="Tren Data 12 Bulan"
                     :height="220"></app-chart-bar>
    </div>

    <!-- Distribusi status — col-span-1 -->
    <app-chart-doughnut :labels="chartStatusLabels"
                        :datasets="chartStatusDatasets"
                        :colors="chartStatusColors"
                        title="Distribusi Status"
                        :height="220"
                        :legend="true"></app-chart-doughnut>
  </div>

  <!-- ============================================================
       ROW 2b — KOMENTAR: siap naik ke "Executive" (2 chart lagi).
       Buka komentar bila Anda punya data kategori & unit yang sudah terisi.
       Butuh: computed chartKategoriLabels/Datasets + chartUnitLabels/Datasets
       (sudah disiapkan sebagai komentar di J_State.html).
       ============================================================ -->
  <!--
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
    <app-chart-bar :labels="chartKategoriLabels"
                   :datasets="chartKategoriDatasets"
                   title="Top Kategori"
                   :height="220"></app-chart-bar>

    <app-chart-bar :labels="chartUnitLabels"
                   :datasets="chartUnitDatasets"
                   title="Distribusi per Unit Kerja"
                   :height="220"></app-chart-bar>
  </div>
  -->

  <!-- ==================== ROW 3: FILTER + TABEL ==================== -->
  <div class="card p-3">
    <app-filter-bar :filters="utamaFilterDefs"
                    v-model="utamaFilters"
                    @change="onFilterUtamaChange"></app-filter-bar>
  </div>

  <app-skeleton v-if="utamaLoading" type="table"></app-skeleton>

  <app-crud-table v-else-if="filteredUtama.length > 0"
                  :items="paginatedUtama"
                  :columns="[
                    { label: 'Kode' },
                    { label: 'Judul' },
                    { label: 'Pegawai', thClass: 'hidden md:table-cell' },
                    { label: 'Kategori', thClass: 'hidden lg:table-cell' },
                    { label: 'Tanggal', thClass: 'hidden md:table-cell' },
                    { label: 'Status', thClass: 'text-center' },
                    { label: 'Aksi', thClass: 'text-right pr-6' }
                  ]"
                  :page="utamaPagination.page"
                  :total-pages="utamaTotalPages"
                  :total-data="filteredUtama.length"
                  @change-page="utamaPagination.page = $event">
    <template #row="{ row }">
      <td class="py-3 px-4 font-mono font-bold text-emerald-600 text-xs">{{ row.kode }}</td>
      <td class="py-3 px-4 font-bold text-slate-800 dark:text-slate-100">
        {{ row.judul }}
        <div v-if="row.deskripsi" class="text-[11px] text-slate-500 dark:text-slate-400 font-normal mt-0.5 line-clamp-1">
          {{ row.deskripsi }}
        </div>
      </td>
      <td class="py-3 px-4 hidden md:table-cell text-slate-700 dark:text-slate-300 text-xs">
        {{ getPegawaiNama(row.pegawai_id) || namaPegawai(row.pegawai_id) }}
      </td>
      <td class="py-3 px-4 hidden lg:table-cell text-slate-500 dark:text-slate-400 text-xs">
        {{ namaKategori_(row.kategori_id) }}
      </td>
      <td class="py-3 px-4 hidden md:table-cell text-xs text-slate-500">
        {{ formatDateDisplay(row.tanggal) }}
      </td>
      <td class="py-3 px-4 text-center">
        <app-badge size="sm"
                   :status="badgeStatusUtama(row.status)"
                   :label="row.status || 'draft'"></app-badge>
      </td>
      <td class="py-3 pl-4 pr-6 text-right whitespace-nowrap">
        <button @click="openUtamaForm(row)" class="btn-icon mr-1.5" title="Edit">
          <i class="fa-solid fa-pen"></i>
        </button>
        <button v-if="isAdmin || isVerifikator" @click="deleteUtama(row)" class="btn-icon btn-icon-danger" title="Hapus">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </td>
    </template>
  </app-crud-table>

  <app-empty-state v-else
                   icon="fa-solid fa-inbox"
                   title="Belum Ada Data"
                   subtitle="Klik tombol Tambah Data untuk membuat entri pertama."
                   action-label="Tambah Data"
                   @action="openUtamaForm()"></app-empty-state>

  <!-- ============================================================
       ROW 4b — KOMENTAR: siap naik ke "Executive" (tabel tambahan).
       Buka komentar bila Anda butuh panel ringkasan tambahan.
