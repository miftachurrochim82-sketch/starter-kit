<!-- ============================================================
     STARTER-KIT - V_Dashboard.html (v2.10.0 — UIUX v1.10 polish)
     4 KPI app-stat-card + 2 chart + table terbaru + RTL ringkas
     min-w + table-scroll + badge valid + btn-icon + filter label + tema #0369a1
     ============================================================ -->
<section v-if="currentPage === 'dashboard'" class="space-y-6 animate-fade-in">

  <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3">
    <div>
      <h2 class="text-2xl font-bold tracking-tight flex items-center gap-2 text-slate-800 dark:text-white">
        <i class="fa-solid fa-gauge-high text-sky-600 dark:text-sky-400"></i> Dashboard
      </h2>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">
        Starter Kit v2.10.0 — 11 sheet + 72 handler + RTL + UIUX 59/28/0/0/56
      </p>
    </div>
    <button class="btn btn-ghost" @click="loadAll()" :disabled="utamaLoading">
      <i class="fa-solid fa-rotate"></i> Segarkan
    </button>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
    <app-stat-card title="Total Utama" :value="dashboardData.totalUtama || 0" icon="fa-solid fa-database" color="sky" subtext="T_UTAMA"></app-stat-card>
    <app-stat-card title="Baru / Draft" :value="dashboardData.totalBaru || 0" icon="fa-solid fa-clock" color="amber" subtext="perlu proses"></app-stat-card>
    <app-stat-card title="Selesai" :value="dashboardData.totalSelesai || 0" icon="fa-solid fa-check" color="emerald" subtext="sudah tuntas"></app-stat-card>
    <app-stat-card title="RTL" :value="dashboardData.totalRtl || 0" icon="fa-solid fa-list-check" color="purple" :subtext="(dashboardData.rtlBaru||0) + ' baru / ' + (dashboardData.rtlSelesai||0) + ' selesai'"></app-stat-card>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
    <div class="card p-4">
      <app-chart-bar :labels="chartTrenLabels" :datasets="chartTrenDatasets" title="Tren T_UTAMA — 12 bulan" :height="220" :colors="chartTrenColors"></app-chart-bar>
    </div>
    <div class="card p-4">
      <app-chart-doughnut :labels="chartStatusLabels" :datasets="chartStatusDatasets" title="Status T_UTAMA" :height="220" :colors="chartStatusColors"></app-chart-doughnut>
    </div>
  </div>

  <div class="card overflow-hidden !p-0">
    <div class="flex items-center gap-2 px-4 py-3 border-b border-slate-100 dark:border-slate-800">
      <i class="fa-solid fa-database text-sky-500"></i>
      <h3 class="font-bold text-slate-700 dark:text-slate-200 text-sm">T_UTAMA Terbaru</h3>
    </div>
    <div v-if="!utamaList.length" class="px-4 py-6 text-xs text-slate-400 text-center">Belum ada data — buat pertama di menu T_UTAMA.</div>
    <div v-else class="table-scroll">
      <table class="w-full text-xs">
        <thead class="border-b bg-slate-50 dark:bg-slate-800/50">
          <tr>
            <th class="text-left py-2 px-3 min-w-[160px]">Kode / Tanggal</th>
            <th class="text-left py-2 px-3 min-w-[260px]">Judul</th>
            <th class="text-left py-2 px-3 min-w-[100px]">Status</th>
            <th class="text-right py-2 px-3 min-w-[120px]">Aksi</th>
          </tr>
        </thead>
        <tbody class="divide-y">
          <tr v-for="r in utamaList.slice(0,5)" :key="r.id" class="hover:bg-slate-50 dark:hover:bg-slate-800/30">
            <td class="py-2 px-3"><div class="font-black">{{ r.kode }}</div><div class="text-[11px] text-slate-400">{{ fmtTgl(r.tanggal) }}</div></td>
            <td class="py-2 px-3"><div class="font-semibold truncate max-w-[260px]">{{ r.judul }}</div><div class="text-[11px] text-slate-400 truncate max-w-[260px]">{{ r.deskripsi || '—' }}</div></td>
            <td class="py-2 px-3"><app-badge size="sm" :status="badgeStatusUtama(r.status)" :label="r.status"></app-badge></td>
            <td class="py-2 px-3 text-right"><button class="btn-icon" @click="currentPage='utama'"><i class="fa-solid fa-eye"></i></button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</section>
