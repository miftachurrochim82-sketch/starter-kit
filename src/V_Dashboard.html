<!-- ============================================================
     STARTER-KIT - V_Dashboard.html (v2.0.0)
     ============================================================
     Contoh halaman Dashboard dengan kit CDN @v2.8.1:
       - 4 kartu KPI (<app-stat-card>)
       - Tabel data (<app-crud-table>) + aksi baris
       - Filter (<app-filter-bar>) — search + status
       - Empty state (<app-empty-state>) + skeleton
       - Tombol "Tambah" (buka modal di V_Modals)

     [SESUAIKAN] Ganti label, kolom, dan field dengan bisnis Anda.
     Pola identik dengan si-kompetensi & si-lahar.
     ============================================================ -->

<section v-if="currentPage === 'dashboard'" class="space-y-6 animate-fade-in">

  <!-- ==================== HEADER ==================== -->
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 border-b border-slate-200/80 dark:border-slate-800 pb-4">
    <div>
      <h2 class="text-2xl font-bold tracking-tight flex items-center gap-2 text-slate-800 dark:text-white">
        <i class="fa-solid fa-gauge-high text-emerald-600 dark:text-emerald-400"></i>
        Dashboard
      </h2>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">
        Ringkasan aplikasi &amp; daftar data contoh.
      </p>
    </div>
    <div class="flex flex-wrap gap-2 self-start md:self-auto">
      <button @click="loadAll()" class="btn btn-secondary text-xs">
        <i class="fa-solid fa-rotate"></i>
        <span>Refresh</span>
      </button>
      <button v-if="isAdmin || isVerifikator || true" @click="openContohForm()" class="btn btn-primary text-xs">
        <i class="fa-solid fa-plus"></i>
        <span>Tambah Contoh</span>
      </button>
    </div>
  </div>

  <!-- ==================== KPI CARDS ==================== -->
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
    <app-stat-card title="Total Pegawai"
                   :value="dashboardData.totalPegawai || 0"
                   icon="fa-solid fa-users"
                   color="sky"
                   subtext="SIMPEG"></app-stat-card>

    <app-stat-card title="Total Contoh"
                   :value="dashboardData.totalContoh || 0"
                   icon="fa-solid fa-list-check"
                   color="emerald"
                   subtext="data tercatat"></app-stat-card>

    <app-stat-card title="Status Aktif"
                   :value="kpiStatusAktif"
                   icon="fa-solid fa-circle-check"
                   color="amber"
                   subtext="draft + diajukan"></app-stat-card>

    <app-stat-card title="Hak Akses"
                   :value="dashboardData.role || 'viewer'"
                   icon="fa-solid fa-shield-halved"
                   color="purple"
                   :subtext="dashboardData.nama || 'user'"></app-stat-card>
  </div>

  <!-- ==================== FILTER BAR ==================== -->
  <div class="card p-3">
    <app-filter-bar :filters="contohFilterDefs"
                    v-model="contohFilters"
                    @change="onFilterContohChange"></app-filter-bar>
  </div>

  <!-- ==================== TABEL ==================== -->
  <app-skeleton v-if="contohLoading" type="table"></app-skeleton>

  <div v-else-if="filteredContoh.length > 0">
    <app-crud-table :items="paginatedContoh"
                    :columns="[
                      { label: 'Kode' },
                      { label: 'Judul' },
                      { label: 'Pegawai', thClass: 'hidden md:table-cell' },
                      { label: 'Tanggal', thClass: 'hidden md:table-cell' },
                      { label: 'Status' },
                      { label: 'Aksi', thClass: 'text-right pr-6' }
                    ]"
                    :page="contohPagination.page"
                    :total-pages="contohTotalPages"
                    :total-data="filteredContoh.length"
                    @change-page="contohPagination.page = $event">
      <template #row="{ row }">
        <td class="py-3 px-4 font-mono font-bold text-emerald-600 text-xs">{{ row.kode }}</td>
        <td class="py-3 px-4 font-bold text-slate-800 dark:text-slate-100">{{ row.judul }}</td>
        <td class="py-3 px-4 hidden md:table-cell text-slate-700 dark:text-slate-300">
          {{ namaPegawai(row.pegawai_id) }}
        </td>
        <td class="py-3 px-4 hidden md:table-cell text-xs text-slate-500">
          {{ formatDateDisplay(row.tanggal) }}
        </td>
        <td class="py-3 px-4">
          <app-badge size="sm"
                     :status="badgeStatusContoh(row.status)"
                     :label="row.status || 'draft'"></app-badge>
        </td>
        <td class="py-3 pl-4 pr-6 text-right whitespace-nowrap">
          <button @click="openContohForm(row)" class="btn-icon mr-1.5" title="Edit">
            <i class="fa-solid fa-pen"></i>
          </button>
          <button v-if="isAdmin" @click="deleteContoh(row)" class="btn-icon btn-icon-danger" title="Hapus">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </td>
      </template>
    </app-crud-table>
  </div>

  <app-empty-state v-else
                   icon="fa-solid fa-inbox"
                   title="Belum Ada Data"
                   subtitle="Klik tombol Tambah Contoh untuk membuat data pertama."
                   action-label="Tambah Contoh"
                   @action="openContohForm()"></app-empty-state>

</section>
