<!-- ==================== SHELL: SIDEBAR + HEADER (komponen kit) ====================
     FRAGMENT: file ini membuka <main> dan div konten; penutupnya ada di Index.html. -->
<div class="flex h-screen overflow-hidden">

  <!-- Backdrop mobile -->
  <div v-if="!sidebarCollapsed && isMobile" @click="sidebarCollapsed = true" class="fixed inset-0 bg-black/50 z-20 md:hidden backdrop-blur-sm"></div>

  <app-sidebar
    :collapsed="sidebarCollapsed"
    :mobile-open="!sidebarCollapsed"
    :dark="isDarkMode"
    :current-page="currentPage"
    :user="session.user || {}"
    :brand="appBrand"
    :menu="menuForKit"
    @navigate="switchPage"
    @toggle="sidebarCollapsed = !sidebarCollapsed"
    @close="sidebarCollapsed = true"
    @logout="logout"
  ></app-sidebar>

  <main class="flex-1 flex flex-col min-w-0 overflow-hidden relative bg-gray-50/50 dark:bg-gray-900/50">

    <app-header
      :dark="isDarkMode"
      app-title="SI-CONTOH"
      :current-page="currentPage"
      :user="session.user || {}"
      @toggle-dark="toggleDark"
      @toggle-mobile="sidebarCollapsed = !sidebarCollapsed"
      @navigate="switchPage"
    ></app-header>

    <!-- Banner error global -->
    <div v-if="errorMessage" class="m-4 mb-0 p-3 bg-rose-50 border-l-4 border-rose-500 rounded-r-xl flex items-center justify-between text-rose-700 text-xs dark:bg-rose-900/20 dark:text-rose-300">
      <span><i class="fa-solid fa-circle-exclamation mr-2"></i>{{ errorMessage }}</span>
      <button type="button" @click="errorMessage = ''"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Layar loading awal (menunggu SSO) -->
    <div v-if="!ready" class="flex-1 flex flex-col items-center justify-center gap-3 text-slate-400">
      <i class="fa-solid fa-circle-notch animate-spin text-3xl text-emerald-500"></i>
      <p class="text-xs font-semibold">Memuat aplikasi &amp; memverifikasi sesi…</p>
    </div>

    <!-- KONTEN HALAMAN (scroll area) -->
    <div v-else class="flex-1 overflow-y-auto p-4 md:p-6">
