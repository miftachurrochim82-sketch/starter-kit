<script>
// ============================================================
// STARTER-KIT - J_Actions.html (v2.0.0)
// ============================================================
// Handler aksi user (klik tombol / submit form).
//
// PRINSIP:
//   - Aksi UI yang memicu API → panggil loader dari J_Api.
//   - Aksi UI murni (buka modal, reset filter) → cukup ubah state.
//   - Klon record saat edit (Object.assign) — cegah perubahan
//     tidak sengaja sebelum "Simpan" ditekan.
//
// [SESUAIKAN] Ganti handler contoh dengan bisnis Anda.
// ============================================================

window.StarterKitActions = {
  methods: {

    // ==================== T_UTAMA: FORM MODAL ====================
    /**
     * Buka modal form T_UTAMA.
     * Kalau `row` diisi → mode edit (klon).
     * Kalau kosong → mode tambah (form default).
     */
    openUtamaForm(row) {
      if (row && row.id) {
        // Mode edit — klon supaya tidak langsung mengubah list
        this.utamaForm = Object.assign({}, row);
      } else {
        // Mode tambah — form default
        this.utamaForm = {
          id:          '',
          kode:        '',
          judul:       '',
          deskripsi:   '',
          pegawai_id:  '',
          kategori_id: '',
          satuan_id:   '',
          tanggal:     '',
          jumlah:      0,
          nilai:       0,
          status:      'draft',
          catatan:     ''
        };
      }
      this.showUtamaForm = true;
    },

    /**
     * Simpan data T_UTAMA.
     * Validasi minimal di frontend, lalu panggil loader di J_Api.
     */
    async saveUtama() {
      // Validasi frontend (minimal — backend tetap validasi)
      if (!String(this.utamaForm.judul || '').trim()) {
        this.showToast('Judul wajib diisi.', 'error');
        return;
      }

      this.utamaSaving = true;
      try {
        var ok = await this.saveUtamaData();
        if (ok) {
          this.showToast('Data berhasil disimpan.', 'success');
          this.showUtamaForm = false;
          await this.loadUtama();         // refresh tabel
          await this.loadDashboard(true); // refresh KPI (silent)
        }
      } finally {
        this.utamaSaving = false;
      }
    },

    /**
     * Hapus data T_UTAMA — konfirmasi dulu.
     */
    async deleteUtama(row) {
      if (!row || !row.id) return;
      if (!confirm('Yakin ingin menghapus data ini?')) return;

      var ok = await this.deleteUtamaData(row.id);
      if (ok) {
        this.showToast('Data berhasil dihapus.', 'success');
        await this.loadUtama();
        await this.loadDashboard(true);
      }
    },

    // ==================== FILTER ====================
    /**
     * Dipanggil <app-filter-bar> @change.
     * Reset paginasi ke halaman 1 saat filter berubah.
     */
    onFilterUtamaChange() {
      this.utamaPagination.page = 1;
    },

    // ==================== UI UTIL ====================
    /**
     * Toggle sidebar collapse — dipanggil <app-sidebar> @toggle.
     * (Bisa juga: `this.$root.toggleSidebar()` — dari AppCore.)
     */
    toggleSidebar() {
      this.sidebarCollapsed = !this.sidebarCollapsed;
    },

    // ==================== LOGOUT ====================
    /**
     * Logout — AppCore.logout() sudah handle call backend + reset state.
     */
    async logout() {
      try {
        await this.$root.logout();
      } catch (e) {
        console.error('Logout error:', e);
      }
    }

    // ==================== PLACEHOLDER 8 SHEET LAIN ====================
    // Buka saat Anda menambah domain (mis. T_ITEM, T_JADWAL).
    // Pola sama persis dengan openUtamaForm/saveUtama/deleteUtama:
    //
    // openItemForm(row) { ... }
    // async saveItem()  { ... }
    // async deleteItem(row) { ... }
    // onFilterItemChange() { ... }

  }
};
</script>
