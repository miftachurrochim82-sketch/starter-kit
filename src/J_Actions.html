<script>
// ============================================================
// STARTER-KIT - J_Actions.html (v2.10.0 — 11 sheet + 72 handler + RTL + UIUX v1.10)
// ============================================================
// Handler aksi user — simpan/hapus/transisi/generate — pola si-arsip v1.10

window.StarterKitActions = {
  methods: {

    // T_UTAMA
    async simpanUtama() {
      if (!String(this.utamaForm.judul || '').trim()) { this.showToast('Judul wajib.', 'warning'); return; }
      this.utamaSaving = true;
      try {
        var res = await this.callServer('save_utama', { record: this.utamaForm });
        if (res && res.success) {
          this.showToast('T_UTAMA disimpan.', 'success');
          this.showUtamaForm = false;
          this.loadUtama(1);
        } else this.showToast(res.error || 'Gagal simpan T_UTAMA', 'error');
      } catch (e) { this.showToast('Error simpan T_UTAMA', 'error'); }
      finally { this.utamaSaving = false; }
    },

    async hapusUtama(r) {
      if (!confirm('Hapus \"' + (r.judul || r.kode) + '\"?')) return;
      try {
        var res = await this.callServer('delete_utama', { id: r.id });
        if (res && res.success) { this.showToast('Dihapus.', 'success'); this.loadUtama(1); }
        else this.showToast(res.error || 'Gagal hapus', 'error');
      } catch (e) { this.showToast('Error hapus', 'error'); }
    },

    // M_REFERENSI
    async simpanReferensi() {
      if (!this.refForm.kategori || !this.refForm.nama_nilai) { this.showToast('Kategori & nama wajib.', 'warning'); return; }
      this.refSaving = true;
      try {
        var res = await this.callServer('save_referensi', { record: this.refForm });
        if (res && res.success) { this.showToast('Referensi disimpan.', 'success'); this.showRefForm = false; this.loadReferensi(); }
        else this.showToast(res.error || 'Gagal simpan referensi', 'error');
      } catch (e) { this.showToast('Error simpan referensi', 'error'); }
      finally { this.refSaving = false; }
    },

    async hapusReferensi(r) {
      if (!confirm('Hapus referensi \"' + (r.nama_nilai || r.kode) + '\"?')) return;
      try {
        var res = await this.callServer('delete_referensi', { id: r.id });
        if (res && res.success) { this.showToast('Dihapus.', 'success'); this.loadReferensi(); }
        else this.showToast(res.error || 'Gagal hapus', 'error');
      } catch (e) { this.showToast('Error hapus', 'error'); }
    },

    // RTL — v2.10.0
    async simpanRtl() {
      if (!String(this.rtlForm.judul_rtl || '').trim()) { this.showToast('Judul RTL wajib.', 'warning'); return; }
      this.rtlSaving = true;
      try {
        var res = await this.callServer('save_tindak_lanjut', { record: this.rtlForm });
        if (res && res.success) {
          this.showToast('RTL disimpan.', 'success');
          this.showRtlForm = false;
          this.loadRtl(this.rtlPage);
        } else this.showToast(res.error || 'Gagal simpan RTL', 'error');
      } catch (e) { this.showToast('Error simpan RTL', 'error'); }
      finally { this.rtlSaving = false; }
    },

    async hapusRtl(r) {
      if (!confirm('Hapus RTL \"' + (r.judul_rtl || r.judul) + '\"?')) return;
      try {
        var res = await this.callServer('delete_tindak_lanjut', { id: r.id });
        if (res && res.success) { this.showToast('RTL dihapus.', 'success'); this.loadRtl(this.rtlPage); }
        else this.showToast(res.error || 'Gagal hapus RTL', 'error');
      } catch (e) { this.showToast('Error hapus RTL', 'error'); }
    },

    openRtlEdit(r) {
      this.rtlForm = Object.assign({ id: '', sumber_evaluasi: 'manual', judul_rtl: '', deskripsi: '', assigned_to: '', due_date: '', status_rtl: 'baru', progress_pct: 0, dokumen_terkait: '', catatan: '' }, r);
      if (r.judul && !this.rtlForm.judul_rtl) this.rtlForm.judul_rtl = r.judul;
      this.showRtlForm = true;
    },

    openRtlStatus(r) {
      this.rtlStatusTarget = r;
      this.rtlStatusBaru = r.status_rtl || r.status || 'diproses';
      this.rtlStatusProgress = r.progress_pct || 0;
      this.rtlStatusCatatan = '';
      this.showRtlStatusForm = true;
    },

    async ubahStatusRtl() {
      this.rtlSaving = true;
      try {
        var res = await this.callServer('ubah_status_tindak_lanjut', { id: this.rtlStatusTarget.id, status_rtl: this.rtlStatusBaru, progress_pct: this.rtlStatusProgress, catatan: this.rtlStatusCatatan });
        if (res && res.success) {
          this.showToast('Status RTL diubah.', 'success');
          this.showRtlStatusForm = false;
          this.loadRtl(this.rtlPage);
        } else this.showToast(res.error || 'Gagal ubah status', 'error');
      } catch (e) { this.showToast('Error ubah status', 'error'); }
      finally { this.rtlSaving = false; }
    }

  }
};
</script>
