     ============================================================ -->

<!-- Modal Form T_UTAMA — size 2xl -->
<app-modal v-if="showUtamaForm" @close="showUtamaForm=false" :title="utamaForm.id ? 'Ubah T_UTAMA' : 'T_UTAMA Baru'" subtitle="Contoh transaksi utama — kode auto, status draft→selesai" icon="fa-solid fa-database" size="2xl" :loading="utamaSaving" confirm-text="Simpan" cancel-text="Batal" @confirm="simpanUtama()">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="form-label">Judul *</label>
      <input class="input w-full" v-model.trim="utamaForm.judul" placeholder="Judul transaksi">
    </div>
    <div>
      <label class="form-label">Tanggal</label>
      <input type="date" class="input w-full" v-model="utamaForm.tanggal">
    </div>
    <div class="md:col-span-2">
      <label class="form-label">Deskripsi</label>
      <textarea class="input w-full" rows="3" v-model.trim="utamaForm.deskripsi"></textarea>
    </div>
    <div>
      <label class="form-label">Kategori</label>
      <select class="input w-full" v-model="utamaForm.kategori_id">
        <option value="">— pilih —</option>
        <option v-for="k in kategoriList" :key="k.id" :value="k.id">{{ k.nama || k.kode }}</option>
      </select>
    </div>
    <div>
      <label class="form-label">Status</label>
      <select class="input w-full" v-model="utamaForm.status">
        <option value="draft">Draft</option>
        <option value="baru">Baru</option>
        <option value="diproses">Diproses</option>
        <option value="selesai">Selesai</option>
        <option value="batal">Batal</option>
      </select>
    </div>
  </div>
</app-modal>

<!-- Modal Form M_REFERENSI — size lg -->
<app-modal v-if="showRefForm" @close="showRefForm=false" :title="refForm.id ? 'Ubah Referensi' : 'Tambah Referensi'" subtitle="Master referensi umum" icon="fa-solid fa-tags" size="lg" :loading="refSaving" confirm-text="Simpan" cancel-text="Batal" @confirm="simpanReferensi()">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="form-label">Kategori *</label>
      <input class="input w-full" v-model.trim="refForm.kategori" placeholder="mis. STATUS">
    </div>
    <div>
      <label class="form-label">Kode</label>
      <input class="input w-full" v-model.trim="refForm.kode" placeholder="mis. BARU">
    </div>
    <div class="md:col-span-2">
      <label class="form-label">Nama Nilai *</label>
      <input class="input w-full" v-model.trim="refForm.nama_nilai" placeholder="mis. Baru">
    </div>
    <div>
      <label class="form-label">Urutan</label>
      <input type="number" class="input w-full" v-model.number="refForm.urutan">
    </div>
    <div>
      <label class="form-label">Status</label>
      <select class="input w-full" v-model="refForm.status_aktif">
        <option value="true">Aktif</option>
        <option value="false">Nonaktif</option>
      </select>
    </div>
  </div>
</app-modal>

<!-- Overlay penutup row menu -->
<div v-if="rowMenuId" class="fixed inset-0 z-20" @click="closeMenu()"></div>
