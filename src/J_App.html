<script>
// ============================================================
// STARTER-KIT - J_App.html (v2.10.0 — 11 sheet + 72 handler + RTL + UIUX v1.10)
// ============================================================

// UIUX v1.10: min-w + table-scroll + badge valid + app-stat-card + btn-icon + filter label + modal v-if

var StarterKitMixin = {
  data: function () { return Object.assign({}, window.StarterKitState.data()); },
  computed: Object.assign({}, window.StarterKitState.computed),
  methods: Object.assign({}, window.StarterKitHelpers.methods, window.StarterKitApi.methods, window.StarterKitActions.methods)
};

var app = AppCore.create({

  appCode: 'SI-CONTOH',
  appTitle: 'SI-CONTOH v2.10.0',
  initialPage: 'dashboard',
  storagePrefix: 'sicontoh',
  platformUrl: 'https://script.google.com/macros/s/AKfycbwh_OUVqmxLcuF81FHmPZtT33Wrm8Ce9Da1SQ3hfkSr7gM5P8ofyAlHSgW40mq3eo-PoQ/exec',

  brand: {
    title: 'SI-CONTOH v2.10.0',
    subtitle: '11 sheet + 72 handler + RTL',
    logoIcon: 'fa-solid fa-cube',
    logoChar: 'SC',
    logoSvg: ''
  },

  // Menu sidebar — v2.10.0: tambah RTL + Laporan (contoh si-arsip)
  menu: [
    { name: 'Utama', items: [
      { id: 'dashboard', label: 'Dashboard', icon: 'fa-solid fa-gauge-high' },
      { id: 'rtl', label: 'RTL', icon: 'fa-solid fa-list-check' },
      { id: 'laporan', label: 'Laporan', icon: 'fa-solid fa-file-lines' }
    ]},
    { name: 'Data', items: [
      { id: 'utama', label: 'T_UTAMA', icon: 'fa-solid fa-database' },
      { id: 'master', label: 'Master', icon: 'fa-solid fa-book' }
    ]},
    { name: 'Sistem', items: [
      { id: 'pengaturan', label: 'Pengaturan', icon: 'fa-solid fa-gear', adminOnly: true }
    ]}
  ],

  pageIcons: {
    dashboard: 'fa-solid fa-gauge-high',
    rtl: 'fa-solid fa-list-check',
    laporan: 'fa-solid fa-file-lines',
    utama: 'fa-solid fa-database',
    master: 'fa-solid fa-book',
    pengaturan: 'fa-solid fa-gear'
  },

  onNavigate: function (vm, page) {
    if (page === 'dashboard') vm.loadAll();
    if (page === 'rtl') { if (!vm.rtlLoading) vm.loadRtl(1); }
    if (page === 'laporan') { if (!vm.lapKlasLoading) vm.loadLapKlasifikasi(); }
    if (page === 'utama') { if (!vm.utamaLoading) vm.loadUtama(1); }
    if (page === 'master') { if (!vm.referensiLoading) vm.loadReferensi(); }
  },

  initApp: async function (vm) {
    if (vm.dataLoaded) return;
    await vm.loadAll(true);
    vm.dataLoaded = true;
  },

  mixins: [StarterKitMixin]
});

app.mount('#app');
</script>
