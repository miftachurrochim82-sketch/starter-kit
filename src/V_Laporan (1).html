<!-- ============================================================
     STARTER-KIT - V_Laporan.html (v2.10.0 — contoh L4/L5 + UIUX v1.10)
     Laporan rekap — filter label + app-stat-card + table-scroll + min-w
     ============================================================ -->
<section v-if="currentPage === 'laporan'" class="space-y-6 animate-fade-in">

  <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3">
    <div>
      <h2 class="text-2xl font-bold tracking-tight flex items-center gap-2 text-slate-800 dark:text-white">
        <i class="fa-solid fa-file-lines text-sky-600 dark:text-sky-400"></i> Laporan
      </h2>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">
        Contoh L4 Rekap Klasifikasi (dari si-arsip) — filter analytics + stat-card + table-scroll
      </p>
    </div>
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
    <button class="btn" :class="laporanTab==='klasifikasi' ? 'btn-primary' : 'btn-ghost'" @click="laporanTab='klasifikasi'"><i class="fa-solid fa-layer-group"></i> Klasifikasi</button>
    <button class="btn" :class="laporanTab==='unit' ? 'btn-primary' : 'btn-ghost'" @click="laporanTab='unit'"><i class="fa-solid fa-building"></i> Per Unit</button>
  </div>

  <div v-if="laporanTab==='klasifikasi'" class="card space-y-4">
    <div class="filter-bar-analytics">
      <h3 class="font-bold text-slate-700 dark:text-slate-200 mr-auto"><i class="fa-solid fa-layer-group text-sky-500"></i> Rekap per Klasifikasi (L4)</h3>
      <div class="w-28"><label class="filter-label">Tahun</label><input type="text" class="input w-full" placeholder="2026" v-model="lapKlasTahun"></div>
      <button class="btn btn-primary" @click="loadLapKlasifikasi()" :disabled="lapKlasLoading"><i class="fa-solid fa-rotate"></i> {{ lapKlasLoading ? 'Memuat...' : 'Tampilkan' }}</button>
    </div>

    <app-skeleton v-if="lapKlasLoading && !lapKlasData" type="table"></app-skeleton>
    <div v-else-if="lapKlasData">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs mb-3">
        <app-stat-card title="Total" :value="lapKlasData.total" icon="fa-solid fa-layer-group" color="sky" :subtext="lapKlasData.tahun"></app-stat-card>
        <app-stat-card title="Rekap" :value="(lapKlasData.rekap||[]).length" icon="fa-solid fa-list" color="emerald" subtext="kategori"></app-stat-card>
        <app-stat-card title="Tahun" :value="lapKlasData.tahun" icon="fa-solid fa-calendar" color="amber" subtext="periode"></app-stat-card>
      </div>
      <div class="table-scroll">
        <table class="w-full text-xs">
          <thead class="text-slate-500 border-b"><tr><th class="text-left py-2 px-2 min-w-[100px]">Kategori</th><th class="text-right py-2 px-2 min-w-[70px]">Jumlah</th></tr></thead>
          <tbody class="divide-y"><tr v-for="r in lapKlasData.rekap" :key="r.kategori_id"><td class="py-2 px-2">{{ r.kategori_id }}</td><td class="py-2 px-2 text-right font-bold">{{ r.jml }}</td></tr></tbody>
        </table>
      </div>
    </div>
    <app-empty-state v-else icon="fa-solid fa-layer-group" title="Belum dimuat" subtitle="Klik Tampilkan untuk rekap."></app-empty-state>
  </div>

  <div v-if="laporanTab==='unit'" class="card p-6 text-center text-xs text-slate-400">
    Per Unit — via lap_rekap_unit (sudah di 01 + 02, tinggal UI seperti Klasifikasi)
  </div>

</section>
