<script>
// ============================================================
// STARTER-KIT - J_State.html (v2.11.0 — 5M+5T + piramida 12/8/6/4 + dashboard 4+4+4)
// ============================================================
// State reaktif + computed untuk seluruh app.
// v2.11.0:
// - Dashboard 4 kartu + 4 chart + 4 panel (data dari server)
// - 5 master: kategori, jenis, periode, satuan, lokasi
// - 12 laporan / 8 analisa / 6 evaluasi (data per-tab)
// - tahunOptions: select tahun (standar UIUX v2 — bukan teks bebas)

window.StarterKitState = {

  data() {
    var th = String(new Date().getFullYear());
    return {

      dataLoaded: false,

      // ==================== DASHBOARD 4+4+4 ====================
      dashboardData: {
        summary: { totalUtama: 0, totalSelesai: 0, approvalMenunggu: 0, rtlTerbuka: 0 },
        chartTren: { labels: [], counts: [] },
        chartJenis: { labels: [], counts: [] },
        chartKategori: { labels: [], counts: [] },
        chartLokasi: { labels: [], counts: [] },
        panelTerbaru: [],
        panelApproval: [],
        panelRtl: [],
        panelTidakLengkap: [],
        role: 'viewer',
        nama: ''
      },

      // ==================== 5 MASTER ====================
      kategoriList: [],
      jenisList: [],
      periodeList: [],
      satuanList: [],
      lokasiList: [],
      pegawaiList: [],
      masterLoading: false,
      masterTab: 'kategori',
      showMasterForm: false,
      masterSaving: false,
      masterForm: {
        id: '', kode: '', nama: '', parent_id: '', deskripsi: '',
        kategori_id: '', periode: 'Fleksibel', tahun: th, bulan: '',
        simbol: '', alamat: '', keterangan: '', urutan: 0, status_aktif: 'true'
      },

      // ==================== T_UTAMA ====================
      utamaList: [],
      utamaLoading: false,
      utamaFilters: { search: '', status: '', jenis_id: '', lokasi_id: '', tahun: '' },
      utamaPagination: { page: 1, per_page: 20 },
      utamaTotal: 0,
      utamaTotalPages: 1,
      showUtamaForm: false,
      utamaSaving: false,
      utamaForm: {
        id: '', kode: '', judul: '', deskripsi: '', pegawai_id: '',
        kategori_id: '', jenis_id: '', lokasi_id: '', periode_id: '', satuan_id: '',
        tanggal: '', jumlah: 0, nilai: 0, status: 'draft', catatan: ''
      },

      // ==================== LAPORAN (12) — 2 tab grid (dimensi | matriks) ====================
      laporanTab: 'kategori',
      laporanGrupTab: 'dimensi',
      lapLoading: false,
      lapTahun: th,
      lapData: {},

      // ==================== ANALISA (8) — grid 1 halaman ====================
      analisaTab: 'lokasi',
      anaLoading: false,
      anaTahun: th,
      anaData: {},
      anaGridLoaded: false,

      // ==================== EVALUASI (6) — grid 1 halaman ====================
      evaluasiTab: 'kelengkapan',
      evaLoading: false,
      evaTahun: th,
      evaData: {},
      evaGridLoaded: false,

      // ==================== RTL ====================
      rtlList: [],
      rtlLoading: false,
      rtlSaving: false,
      rtlGenerating: false,
      rtlGenerateSumber: 'semua',
      rtlGenerateTahun: th,
      rtlSearch: '',
      rtlFilters: { status_rtl: '', sumber_evaluasi: '', tahun: '' },
      rtlPage: 1,
      rtlTotalPages: 1,
      rtlTotalData: 0,
      showRtlForm: false,
      showRtlStatusForm: false,
      rtlForm: { id: '', sumber_evaluasi: 'manual', judul_rtl: '', deskripsi: '', assigned_to: '', due_date: '', status_rtl: 'baru', progress_pct: 0, dokumen_terkait: '', catatan: '' },
      rtlStatusTarget: {},
      rtlStatusBaru: 'diproses',
      rtlStatusProgress: 0,
      rtlStatusCatatan: '',

      // ==================== UI ====================
      rowMenuId: null,

      // ==================== PENGATURAN v2.12.0 (tema Opsi B + scope) ====================
      filterScope: 'all',
      pendingTheme: null,
      themeSaving: false,
      themeMsg: '',
      themeMsgOk: false
    };
  },

  computed: {

    // Tahun: opsi select (tahun saat ini -3..0 + tahun yang ada di data)
    tahunOptions() {
      var now = String(new Date().getFullYear());
      var set = {};
      set[now] = 1;
      set[String(Number(now) - 1)] = 1;
      set[String(Number(now) - 2)] = 1;
      set[String(Number(now) - 3)] = 1;
      (this.utamaList || []).forEach(function (r) {
        var t = String(r.tanggal || '').slice(0, 4);
        if (/^\d{4}$/.test(t)) set[t] = 1;
      });
      return Object.keys(set).sort().reverse();
    },

    // ---------- akses chart dashboard (shape aman) ----------
    dashTren() { return this.dashboardData.chartTren || { labels: [], counts: [] }; },
    dashJenis() { return this.dashboardData.chartJenis || { labels: [], counts: [] }; },
    dashKategori() { return this.dashboardData.chartKategori || { labels: [], counts: [] }; },
    dashLokasi() { return this.dashboardData.chartLokasi || { labels: [], counts: [] }; },

    // warna chart — tema #0369a1 (sky)
    chartTrenColors() { return ['#0369a1']; },
    chartJenisColors() { return ['#0284c7']; },
    chartKategoriColors() { return ['#0ea5e9', '#38bdf8', '#7dd3fc', '#bae6fd', '#0c4a6e', '#334155', '#64748b', '#94a3b8']; },
    chartLokasiColors() { return ['#0369a1']; },
    chartTrenAnalisaColors() { return ['#f59e0b']; },

    // ---------- data laporan/analisa/evaluasi per tab ----------
    lapDataAktif() { return this.lapData[this.laporanTab] || null; },
    anaDataAktif() { return this.anaData[this.analisaTab] || null; },
    evaDataAktif() { return this.evaData[this.evaluasiTab] || null; },

    // trend chart analisa (A6)
    chartAnalisaTrenLabels() {
      var d = this.anaData['tren'];
      return d && d.periode ? d.periode.map(function (k) {
        var p = String(k).split('-');
        var names = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
        return names[Number(p[1]) - 1] + ' ' + p[0].slice(2);
      }) : [];
    },
    chartAnalisaTrenDatasets() {
      var d = this.anaData['tren'];
      return d && d.counts ? [{ label: 'Jumlah', data: d.counts }] : [];
    }
  }
};
</script>
