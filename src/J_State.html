  // ==================== COMPUTED ====================

    // ==================== KPI TURUNAN ====================
    kpiStatusAktif() {
      return (this.utamaList || []).filter(function (r) {
        var st = String(r.status || '').toLowerCase();
        return st === 'draft' || st === 'diajukan' || st === 'proses';
      }).length;
    },

    // ==================== FILTER & PAGINASI T_UTAMA ====================
    utamaFilterDefs() {
      return [
        { key: 'search', label: 'Pencarian', type: 'text', placeholder: 'Cari kode, judul, deskripsi…' },
        { key: 'status', label: 'Status', type: 'select', options: [
          { value: 'draft',    label: 'Draft' },
          { value: 'diajukan', label: 'Diajukan' },
          { value: 'proses',   label: 'Proses' },
          { value: 'selesai',  label: 'Selesai' },
          { value: 'ditolak',  label: 'Ditolak' }
        ] }
      ];
    },

    filteredUtama() {
      var f = this.utamaFilters || {};
      var q = String(f.search || '').toLowerCase().trim();
      var st = String(f.status || '').toLowerCase().trim();
      var self = this;

      return (this.utamaList || []).filter(function (r) {
        if (st && String(r.status || '').toLowerCase().trim() !== st) return false;
        if (q) {
          var hay = [
            r.kode, r.judul, r.deskripsi, r.catatan,
            self.getPegawaiNama(r.pegawai_id)
          ].map(function (x) { return String(x || '').toLowerCase().trim(); }).join(' ');
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });
    },

    paginatedUtama() {
      return AppCore.paginate(this.filteredUtama, this.utamaPagination.page, this.utamaPagination.limit);
    },

    utamaTotalPages() {
      return AppCore.pageCount(this.filteredUtama, this.utamaPagination.limit);
    },

    // ==================== CHART: TREN 12 BULAN ====================
    /**
     * Label bulan 12 terakhir (bulan ini + 11 bulan ke belakang).
     * Contoh: ['Okt 25','Nov 25',...,'Sep 26']
     */
    chartTrenLabels() {
      var labels = [];
      var names = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
      var now = new Date();
      for (var i = 11; i >= 0; i--) {
        var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        labels.push(names[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2));
      }
      return labels;
    },

    /**
     * Jumlah data per bulan (dari utamaList, pakai field `tanggal`
     * fallback ke `created_at`).
     */
    chartTrenDatasets() {
      var counts = {};
      var keys = [];
      var now = new Date();
      // Init 12 bulan terakhir dengan 0
      for (var i = 11; i >= 0; i--) {
        var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        var k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
        keys.push(k);
        counts[k] = 0;
      }
      // Hitung dari list
      (this.utamaList || []).forEach(function (r) {
        var tgl = r.tanggal || r.created_at || '';
        var k = String(tgl).slice(0, 7);   // ambil 'YYYY-MM'
        if (counts[k] !== undefined) counts[k]++;
      });
      return [{ label: 'Jumlah Data', data: keys.map(function (k) { return counts[k]; }) }];
    },

    chartTrenColors() {
      return ['#059669'];   // emerald
    },

    // ==================== CHART: DISTRIBUSI STATUS ====================
    chartStatusLabels() {
      return ['Draft', 'Diajukan', 'Proses', 'Selesai', 'Ditolak'];
    },

    chartStatusDatasets() {
      var counts = { draft: 0, diajukan: 0, proses: 0, selesai: 0, ditolak: 0 };
      (this.utamaList || []).forEach(function (r) {
        var s = String(r.status || 'draft').toLowerCase();
        if (counts[s] !== undefined) counts[s]++;
      });
      return [{
        label: 'Status',
        data: [counts.draft, counts.diajukan, counts.proses, counts.selesai, counts.ditolak]
      }];
    },

    chartStatusColors() {
      return ['#94a3b8', '#0ea5e9', '#f59e0b', '#10b981', '#f43f5e'];
      // abu-slate, sky, amber, emerald, rose
    },
