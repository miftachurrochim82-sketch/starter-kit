<script>
// ============================================================
// STARTER-KIT - J_State.html (v2.10.0 — 11 sheet + 72 handler + RTL + UIUX v1.10)
// ============================================================
// State reaktif + computed untuk seluruh app.
// v2.10.0: tambah RTL state (R1-R5 contoh si-arsip) + laporan/analisa/evaluasi state + UIUX v1.10 polish
// - min-w + table-scroll di view, badge valid, app-stat-card, btn-icon, filter label, modal v-if

window.StarterKitState = {

  data() {
    return {

      dataLoaded: false,

      // Dashboard KPI
      dashboardData: {
        totalUtama: 0,
        totalBaru: 0,
        totalSelesai: 0,
        totalRekap: 0,
        totalRtl: 0,
        rtlBaru: 0,
        rtlSelesai: 0,
        role: 'viewer',
        nama: ''
      },

      // T_UTAMA
      utamaList: [],
      utamaLoading: false,
      utamaFilters: { search: '', status: '' },
      utamaPagination: { page: 1, limit: 10 },
      showUtamaForm: false,
      utamaSaving: false,
      utamaForm: {
        id: '', kode: '', judul: '', deskripsi: '', pegawai_id: '', kategori_id: '', satuan_id: '',
        tanggal: '', jumlah: 0, nilai: 0, status: 'draft', catatan: ''
      },

      // M_REFERENSI
      referensiList: [],
      referensiLoading: false,
      kategoriList: [],
      satuanList: [],

      // M_KATEGORI / M_SATUAN (generic master)
      masterTab: 'referensi',
      refForm: { id: '', kategori: '', kode: '', nama_nilai: '', urutan: 0, status_aktif: 'true', keterangan: '' },
      showRefForm: false,
      refSaving: false,

      // T_TINDAK_LANJUT / RTL — v2.10.0 (contoh si-arsip R1-R5)
      rtlList: [],
      rtlLoading: false,
      rtlSaving: false,
      rtlGenerating: false,
      rtlGenerateSumber: 'semua',
      rtlGenerateTahun: String(new Date().getFullYear()),
      rtlSearch: '',
      rtlFilters: { status_rtl: '', sumber_evaluasi: '', tahun: '' },
      rtlPage: 1,
      rtlTotalPages: 1,
      rtlTotalData: 0,
      showRtlForm: false,
      showRtlStatusForm: false,
      rtlForm: { id: '', sumber_evaluasi: 'manual', judul_rtl: '', deskripsi: '', assigned_to: '', due_date: '', status_rtl: 'baru', progress_pct: 0, dokumen_terkait: '', catatan: '' },
      rtlStatusTarget: {},
      rtlStatusBaru: 'diproses',
      rtlStatusProgress: 0,
      rtlStatusCatatan: '',

      // Laporan (generic)
      laporanTab: 'klasifikasi',
      lapKlasData: null,
      lapKlasLoading: false,
      lapKlasTahun: String(new Date().getFullYear()),

      // Analisa
      analisaTab: 'unit',
      analisaTahun: String(new Date().getFullYear()),
      analisaUnitData: null,
      analisaLoading: false,

      // Row menu
      rowMenuId: null
    };
  },

  computed: {

    // KPI turunan
    kpiStatusAktif() {
      return (this.utamaList || []).filter(function (r) {
        var st = String(r.status || '').toLowerCase();
        return st === 'draft' || st === 'diajukan' || st === 'proses';
      }).length;
    },

    // Filter & paginasi T_UTAMA
    utamaFilterDefs() {
      return [
        { key: 'search', label: 'Pencarian', type: 'text', placeholder: 'Cari kode, judul, deskripsi…', span: 2 },
        { key: 'status', label: 'Status', type: 'select', options: [
          { value: 'draft', label: 'Draft' },
          { value: 'baru', label: 'Baru' },
          { value: 'diproses', label: 'Diproses' },
          { value: 'selesai', label: 'Selesai' },
          { value: 'batal', label: 'Batal' }
        ] }
      ];
    },

    filteredUtama() {
      var f = this.utamaFilters || {};
      var q = String(f.search || '').toLowerCase().trim();
      var st = String(f.status || '').toLowerCase().trim();
      var self = this;
      return (this.utamaList || []).filter(function (r) {
        if (st && String(r.status || '').toLowerCase().trim() !== st) return false;
        if (q) {
          var hay = [r.kode, r.judul, r.deskripsi, r.catatan].map(function (x) { return String(x || '').toLowerCase(); }).join(' ');
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });
    },

    paginatedUtama() {
      return AppCore.paginate(this.filteredUtama, this.utamaPagination.page, this.utamaPagination.limit);
    },

    utamaTotalPages() {
      return AppCore.pageCount(this.filteredUtama, this.utamaPagination.limit);
    },

    // Chart tren 12 bulan
    chartTrenLabels() {
      var labels = [];
      var names = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
      var now = new Date();
      for (var i = 11; i >= 0; i--) {
        var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        labels.push(names[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2));
      }
      return labels;
    },

    chartTrenDatasets() {
      var counts = {};
      var keys = [];
      var now = new Date();
      for (var i = 11; i >= 0; i--) {
        var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        var k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
        keys.push(k);
        counts[k] = 0;
      }
      (this.utamaList || []).forEach(function (r) {
        var tgl = r.tanggal || r.created_at || '';
        var k = String(tgl).slice(0, 7);
        if (counts[k] !== undefined) counts[k]++;
      });
      return [{ label: 'Jumlah Data', data: keys.map(function (k) { return counts[k]; }) }];
    },

    chartTrenColors() { return ['#0369a1']; },

    chartStatusLabels() { return ['Draft', 'Baru', 'Diproses', 'Selesai', 'Batal']; },

    chartStatusDatasets() {
      var counts = { draft: 0, baru: 0, diproses: 0, selesai: 0, batal: 0 };
      (this.utamaList || []).forEach(function (r) {
        var s = String(r.status || 'draft').toLowerCase();
        if (counts[s] !== undefined) counts[s]++;
      });
      return [{ label: 'Status', data: [counts.draft, counts.baru, counts.diproses, counts.selesai, counts.batal] }];
    },

    chartStatusColors() { return ['#94a3b8', '#0ea5e9', '#f59e0b', '#10b981', '#f43f5e']; }

  }

};
</script>
