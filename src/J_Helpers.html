<script>
// ============================================================
// STARTER-KIT - J_Helpers.html (v2.0.0)
// ============================================================
// Helper MURNI domain app (bukan UI state, bukan API loader).
//
// PRINSIP CDN-FIRST:
//   AppCore (kit) sudah punya helper umum — JANGAN tulis ulang:
//     this.namaPegawai(id)         — dari masterPegawaiList
//     this.namaUnit(id)            — dari masterUnitList
//     this.namaJabatan(id)         — dari masterJabatanList
//     this.formatDateDisplay(val)  — dd/MM/yyyy
//     this.formatDateTimeDisplay(v)
//     this.formatRupiah(n)
//     this.showToast(msg, type)
//     this.loadLib(name, opts)     — chart/xlsx/jspdf/pdflib
//     this.callServer(action, data)
//
//   Yang ditulis di sini HANYA yang khas app Anda
//   (status mapping, lookup domain, kalkulasi unik).
//
// [SESUAIKAN] Ganti helper contoh sesuai bisnis Anda.
// ============================================================

window.StarterKitHelpers = {
  methods: {

    // ==================== STATUS BADGE MAPPING ====================
    /**
     * Map status T_UTAMA → badge status kit (<app-badge status="...">).
     *
     * Kit mendukung status: disetujui/approved/aktif (hijau),
     * menunggu/pending (kuning), proses (biru), revisi (sky),
     * ditolak/rejected/inactive (merah), purple/pppk (ungu).
     */
    badgeStatusUtama(status) {
      var s = String(status || '').toLowerCase().trim();
      if (s === 'draft')    return 'menunggu';
      if (s === 'diajukan') return 'info';
      if (s === 'proses')   return 'proses';
      if (s === 'selesai')  return 'disetujui';
      if (s === 'ditolak')  return 'ditolak';
      return 'menunggu';
    },

    // ==================== LOOKUP DOMAIN ====================
    /**
     * Ambil nama kategori dari `kategoriList` (M_KATEGORI).
     * Fallback ke kode, lalu ke '(tanpa)'.
     */
    namaKategori_(id) {
      var key = String(id || '').trim();
      if (!key) return '—';
      var list = this.kategoriList || [];
      for (var i = 0; i < list.length; i++) {
        var k = list[i] || {};
        if (String(k.id || '').trim() === key) {
          return k.nama || k.kode || key;
        }
      }
      return key;   // fallback: tampilkan ID apa adanya
    },

    /**
     * Ambil nama satuan dari `satuanList` (M_SATUAN).
     */
    namaSatuan_(id) {
      var key = String(id || '').trim();
      if (!key) return '—';
      var list = this.satuanList || [];
      for (var i = 0; i < list.length; i++) {
        var s = list[i] || {};
        if (String(s.id || '').trim() === key) {
          return s.nama || s.simbol || key;
        }
      }
      return key;
    },

    /**
     * Nama pegawai — prioritas field `nama_lengkap` (konvensi SIMPEG),
     * melengkapi AppCore.namaPegawai() yang hanya cek `nama`.
     */
    getPegawaiNama(id) {
      if (!id) return '';
      var list = (this.$root && this.$root.masterPegawaiList && this.$root.masterPegawaiList.length)
        ? this.$root.masterPegawaiList
        : (this.masterPegawaiList || []);
      var target = String(id).trim();
      for (var i = 0; i < list.length; i++) {
        var p = list[i] || {};
        if (String(p.id || '').trim() === target ||
            String(p.pegawai_id || '').trim() === target ||
            String(p.nip || '').trim() === target) {
          return p.nama_lengkap || p.nama || p.display_name || '';
        }
      }
      return '';
    },

    /**
     * NIP pegawai dari id-nya.
     */
    nipPegawai(id) {
      if (!id) return '-';
      var list = (this.$root && this.$root.masterPegawaiList && this.$root.masterPegawaiList.length)
        ? this.$root.masterPegawaiList
        : (this.masterPegawaiList || []);
      var target = String(id).trim();
      for (var i = 0; i < list.length; i++) {
        var p = list[i] || {};
        if (String(p.id || '').trim() === target ||
            String(p.pegawai_id || '').trim() === target ||
            String(p.nip || '').trim() === target) {
          return p.nip || '-';
        }
      }
      return '-';
    },

    // ==================== UTIL KECIL ====================
    /**
     * Normalisasi string untuk perbandingan filter (lowercase + trim).
     * Cermin CoreLib.normStr() versi frontend.
     */
    normStr(v) {
      return String(v == null ? '' : v).trim().toLowerCase();
    },

    /**
     * Format nama dengan gelar: "BUDI SANTOSO, S.H." → "Budi Santoso, S.H."
     */
    formatNamaPegawai(str) {
      if (!str || str === '-') return '-';
      var s = String(str).trim();
      if (s.indexOf(',') !== -1) {
        var parts = s.split(',');
        var depan = parts[0].trim().toLowerCase().replace(/(^|\s)\S/g, function (c) { return c.toUpperCase(); });
        var gelar = parts.slice(1).join(',').trim();
        return depan + ', ' + gelar;
      }
      return s.toLowerCase().replace(/(^|\s)\S/g, function (c) { return c.toUpperCase(); });
    },

    /**
     * Format nilai uang ringkas untuk dashboard.
     * 1500000 → "1,5 Jt"; 1500000000 → "1,5 M"; < 1 juta → "Rp 250.000"
     */
    formatRupiahRingkas_(n) {
      var num = Number(n) || 0;
      var abs = Math.abs(num);
      if (abs >= 1e9) return (num / 1e9).toFixed(1).replace('.', ',') + ' M';
      if (abs >= 1e6) return (num / 1e6).toFixed(1).replace('.', ',') + ' Jt';
      if (abs >= 1e3) return (num / 1e3).toFixed(0) + ' Rb';
      return this.formatRupiah(num);
    }

    // ==================== [SESUAIKAN] Helper bisnis Anda ====================
    // Kandidat:
    //   hitungTotalNilai(list)          → sum kolom nilai
    //   isExpiringSoon(tgl, hariAwal)   → boolean (H-90 alert)
    //   warnaStatusKustom(status)       → class Tailwind

  }
};
</script>
