<script>
// ============================================================
// STARTER-KIT - J_Helpers.html (v2.11.0 — lookup nama (UIUX v2: nama bukan ID) + fmtTgl)
// ============================================================
// Helper MURNI domain app + standar UIUX v2 (audit si-dokumen 2026-09-22):
// - fmtTgl (WIB), badge mapping valid, lookup nama per master,
//   formatBytes_, formatRupiahRingkas_

window.StarterKitHelpers = {
  methods: {

    // ==================== TANGGAL (WIB) ====================
    fmtTgl(val) {
      if (!val) return '—';
      try {
        var d = new Date(val);
        if (isNaN(d.getTime())) return String(val);
        if (window.CoreLib && CoreLib.dateKey10) {
          var k = CoreLib.dateKey10(val);
          if (k) {
            var parts = k.split('-');
            return parts[2] + '/' + parts[1] + '/' + parts[0];
          }
        }
        return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
      } catch (e) { return String(val); }
    },

    formatTanggal(val) { return this.fmtTgl(val); },

    // ==================== BADGE MAPPING (status valid kit) ====================
    badgeStatusUtama(status) {
      var s = String(status || '').toLowerCase().trim();
      if (s === 'selesai' || s === 'disetujui') return 'disetujui';
      if (s === 'baru' || s === 'draft') return 'draft';
      if (s === 'diproses' || s === 'proses') return 'proses';
      if (s === 'menunggu' || s === 'diajukan') return 'menunggu';
      if (s === 'batal' || s === 'ditolak') return 'ditolak';
      if (s === 'revisi') return 'revisi';
      if (s === 'verifikasi') return 'verifikasi';
      return 'proses';
    },

    badgeStatusApproval(status) {
      var s = String(status || '').toLowerCase().trim();
      if (s === 'disetujui' || s === 'selesai') return 'disetujui';
      if (s === 'ditolak' || s === 'batal') return 'ditolak';
      if (s === 'revisi') return 'revisi';
      if (s === 'menunggu') return 'menunggu';
      return 'menunggu';
    },

    badgeStatusRtl(status) {
      var s = String(status || '').toLowerCase().trim();
      if (s === 'selesai') return 'disetujui';
      if (s === 'batal') return 'ditolak';
      if (s === 'diproses') return 'menunggu';
      if (s === 'baru') return 'proses';
      return 'proses';
    },

    badgeSumberEvaluasi(sumber) {
      var s = String(sumber || '').toUpperCase().trim();
      if (s === 'E2') return 'ditolak';
      if (s === 'E3') return 'menunggu';
      if (s === 'E1') return 'proses';
      return 'disetujui';
    },

    // ==================== LOOKUP NAMA (standar: nama, bukan ID) ====================
    _lookup(list, key, fields) {
      var k = String(key || '').trim();
      if (!k) return '—';
      var arr = list || [];
      for (var i = 0; i < arr.length; i++) {
        var r = arr[i] || {};
        var id = String(r.id || r.pegawai_id || '').trim();
        if (id === k) {
          for (var f = 0; f < fields.length; f++) {
            if (r[fields[f]]) return r[fields[f]];
          }
        }
      }
      return k;
    },

    namaKategori_(id) { return this._lookup(this.kategoriList, id, ['nama', 'kode']); },
    namaJenis_(id) { return this._lookup(this.jenisList, id, ['nama', 'kode']); },
    namaPeriode_(id) { return this._lookup(this.periodeList, id, ['label', 'kode']); },
    namaSatuan_(id) { return this._lookup(this.satuanList, id, ['nama', 'simbol', 'kode']); },
    namaLokasi_(id) { return this._lookup(this.lokasiList, id, ['nama', 'kode']); },
    namaPegawai_(id) { return this._lookup(this.pegawaiList, id, ['nama']); },

    // ==================== UTIL KECIL ====================
    normStr(v) { return String(v == null ? '' : v).trim().toLowerCase(); },

    formatBytes_(n) {
      var v = Number(n) || 0;
      if (v < 1024) return v + ' B';
      if (v < 1024 * 1024) return (v / 1024).toFixed(1) + ' KB';
      return (v / (1024 * 1024)).toFixed(2) + ' MB';
    },

    formatRupiahRingkas_(n) {
      var num = Number(n) || 0;
      var abs = Math.abs(num);
      if (abs >= 1e9) return (num / 1e9).toFixed(1).replace('.', ',') + ' M';
      if (abs >= 1e6) return (num / 1e6).toFixed(1).replace('.', ',') + ' Jt';
      if (abs >= 1e3) return (num / 1e3).toFixed(0) + ' Rb';
      return 'Rp ' + num.toLocaleString('id-ID');
    },

    toggleRowMenu(id) {
      this.rowMenuId = this.rowMenuId === id ? null : id;
    },
    closeMenu() { this.rowMenuId = null; },

    // Sel matriks korelasi Jenis × Lokasi (A5)
    korelasiCell_(jenisId, lokasiId) {
      var d = this.anaData['korelasi'];
      if (!d || !d.cells) return 0;
      for (var i = 0; i < d.cells.length; i++) {
        var c = d.cells[i];
        if (String(c.jenis_id) === String(jenisId) && String(c.lokasi_id) === String(lokasiId)) return c.jml;
      }
      return 0;
    }
  }
};
</script>
